<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Generator</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
        <div class="container">
        <h1>Workout Generator</h1>

        <form id="quizForm">
        <section id="question1">
            <h2>1: What equipment do you have?</h2>
                        <label>
                                <input type="radio" name="equipment" value="bodyweight" required>
                                <div class="img-wrap">
                                    <img width="120" src="bodyweight.gif" alt="pushup gif">
                                    <span class="caption">Bodyweight Only</span>
                                </div>
                        </label>
            <br>
            <label>
                <input type="radio" name="equipment" value="bars">
                                <div class="img-wrap">
                                    <img width="120" src="bar.gif" alt="pullup gif">
                                    <span class="caption">Bodyweight with bars (dip bars or pull-up bars)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="radio" name="equipment" value="dumbbells">
                                <div class="img-wrap">
                                    <img width="120" src="curl.gif" alt="dumbell curls gif">
                                    <span class="caption">Dumbbells</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="radio" name="equipment" value="gym">
                                <div class="img-wrap">
                                    <img width="120" src="rows.gif" alt="incline rows on cable machine gif">
                                    <span class="caption">Gym equipment (barbells, machines, cables)</span>
                                </div>
            </label>
            <br>
            <button type="button" id="next1">Next</button>
        </section>

        <section id="question2" hidden>
            <h2>2: What muscles do you want to target?</h2>
            <label>
                <input type="checkbox" name="muscle" value="chest">
                                <div class="img-wrap">
                                    <img width="120" src="chest.jpg" alt="Chest image">
                                    <span class="caption">Chest (push movements, upper and lower pectorals)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="back">
                                <div class="img-wrap">
                                    <img width="120" src="back.jpg" alt="Back image">
                                    <span class="caption">Back (pulling muscles, lats, traps, erector spinae)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="shoulders">
                                <div class="img-wrap">
                                    <img width="120" src="shoulders.jpg" alt="Shoulders image">
                                    <span class="caption">Shoulders (deltoids and rotator cuff)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="arms">
                                <div class="img-wrap">
                                    <img width="120" src="biceps.jpg" alt="Biceps image">
                                    <img width="120" src="trices.jpg" alt="Tricpes image">
                                    <img width="120" src="forearms.jpg" alt="Forearms image">
                                    <span class="caption">Arms (biceps, triceps, forearms)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="core">
                                <div class="img-wrap">
                                    <img width="120" src="abs.jpg" alt="Core image">
                                    <span class="caption">Core (abs, obliques, deep core muscles)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="legs">
                                <div class="img-wrap">
                                    <img width="120" src="legs.jpg" alt="Legs image">
                                    <span class="caption">Legs & lower body (quads, hamstrings, glutes, calves)</span>
                                </div>
            </label>
            <br>
            <label>
                <input type="checkbox" name="muscle" value="neck">
                                <div class="img-wrap">
                                    <img width="120" src="neck.jpg" alt="Neck image">
                                    <span class="caption">Neck (neck flexors and extensors)</span>
                                </div>
            </label>
            <br>
            <button type="button" id="next2">Submit</button>
        </section>
    </form>

    <div id="resultBox" hidden></div>
    <button type="button" id="redoButton" hidden>Redo Quiz</button>

        </div>

    <script>
        const quizForm = document.getElementById('quizForm');
        const resultBox = document.getElementById('resultBox');
        const redoButton = document.getElementById('redoButton');
        const question1 = document.getElementById('question1');
        const question2 = document.getElementById('question2');
        const next1 = document.getElementById('next1');
        const next2 = document.getElementById('next2');

        function showSection(section) {
            question1.hidden = true;
            question2.hidden = true;
            section.hidden = false;
        }

        next1.addEventListener('click', function() {
            const equipment = document.querySelector('input[name="equipment"]:checked');
            if (!equipment) {
                resultBox.textContent = 'Please select your equipment before moving on.';
                resultBox.hidden = false;
                return;
            }
            resultBox.hidden = true;
            showSection(question2);
        });

        next2.addEventListener('click', function() {
            const equipment = document.querySelector('input[name="equipment"]:checked');
            const muscles = document.querySelectorAll('input[name="muscle"]:checked');

            if (!equipment || muscles.length === 0) {
                resultBox.textContent = 'Please complete every question before submitting.';
                resultBox.hidden = false;
                return;
            }

            const equipmentValue = equipment.value;
            const targetMuscles = Array.from(muscles).map(input => input.value);

            const workoutMap = {
                bodyweight: {
                    chest: 'Decline push-ups, standard push-ups, scapular push-ups.',
                    back: 'Inverted rows, pull-up negatives, supermans.',
                    shoulders: 'Pike push-ups, handstand practice, rear delt floor flies.',
                    arms: 'Diamond push-ups, bodyweight tricep extensions, doorframe curls.',
                    core: 'Planks, hollow body holds, leg raises.',
                    legs: 'Bodyweight squats, lunges, glute bridges, calf raises.',
                    neck: 'Prone neck extensions, supine neck flexion with slow control.'
                },
                bars: {
                    chest: 'Incline feet-elevated pike push-ups, chest dips, ring push-ups.',
                    back: 'Pull-ups, chin-ups, inverted rows, hanging scapular shrugs.',
                    shoulders: 'Dips with vertical torso, hanging shoulder raises, assisted handstands.',
                    arms: 'Close-grip chin-ups, tricep dips, neutral-grip pull-ups.',
                    core: 'Hanging leg raises, toes-to-bar, L-sits on dip bars.',
                    legs: 'Assisted pistol squats, Bulgarian split squats using bars, step-ups.',
                    neck: 'Use bands or careful bodyweight neck control exercises off the bars.'
                },
                dumbbells: {
                    chest: 'Incline dumbbell bench press, dumbbell flyes, dumbbell pullovers.',
                    back: 'Single-arm dumbbell rows, dumbbell shrugs, dumbbell pullovers.',
                    shoulders: 'Dumbbell shoulder press, lateral raises, rear delt raises.',
                    arms: 'Incline dumbbell curls, hammer curls, overhead dumbbell extensions.',
                    core: 'Dumbbell side bends, weighted Russian twists, dumbbell planks.',
                    legs: 'Dumbbell squats, lunges, Romanian deadlifts, calf raises.',
                    neck: 'Light dumbbell neck flexion and extension only with care.'
                },
                gym: {
                    chest: 'Incline barbell bench press, cable crossovers, machine chest press.',
                    back: 'Lat pulldowns, barbell rows, seated cable rows.',
                    shoulders: 'Overhead barbell press, cable lateral raises, rear delt cable flyes.',
                    arms: 'Preacher curls, cable pushdowns, cable hammer curls.',
                    core: 'Cable crunches, ab wheel rollouts, captain’s chair leg raises.',
                    legs: 'Back squats, leg press, Romanian deadlifts, seated calf raises.',
                    neck: 'Neck harness extensions, light weighted neck flexion.'
                }
            };

            let results = '<p><strong>Equipment:</strong> ' + equipmentValue + '</p>';
            results += '<p><strong>Targets:</strong> ' + targetMuscles.join(', ') + '</p>';

            targetMuscles.forEach(function(target) {
                const workout = workoutMap[equipmentValue][target];
                results += '<p><strong>' + target.charAt(0).toUpperCase() + target.slice(1) + ':</strong> ' + workout + '</p>';
            });

            resultBox.innerHTML = results;
            resultBox.hidden = false;
            quizForm.hidden = true;
            redoButton.hidden = false;
        });

        redoButton.addEventListener('click', function() {
            quizForm.reset();
            showSection(question1);
            quizForm.hidden = false;
            resultBox.hidden = true;
            resultBox.textContent = '';
            redoButton.hidden = true;
        });
    </script>
</body>
</html>
