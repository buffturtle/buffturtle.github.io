<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Quiz</title>
</head>
<body>
    <h1>Image Choice Quiz</h1>
    <p>Choose the pictures that feel most like you. You can select more than one.</p>

    <form id="quizForm">
        <div>
            <h2>Question 1: Which images match your personality?</h2>
            <label>
                <input type="checkbox" name="choice1" value="sunny">
                <img src="https://via.placeholder.com/120?text=Sunny" alt="Sunny image">
                Sunny
            </label>
            <br>
            <label>
                <input type="checkbox" name="choice1" value="star">
                <img src="https://via.placeholder.com/120?text=Star" alt="Star image">
                Star
            </label>
            <br>
            <label>
                <input type="checkbox" name="choice1" value="wave">
                <img src="https://via.placeholder.com/120?text=Wave" alt="Wave image">
                Wave
            </label>
        </div>

        <div>
            <h2>Question 2: Which images match your personality?</h2>
            <label>
                <input type="checkbox" name="choice2" value="sunny">
                <img src="https://via.placeholder.com/120?text=Sunny" alt="Sunny image">
                Sunny
            </label>
            <br>
            <label>
                <input type="checkbox" name="choice2" value="star">
                <img src="https://via.placeholder.com/120?text=Star" alt="Star image">
                Star
            </label>
            <br>
            <label>
                <input type="checkbox" name="choice2" value="wave">
                <img src="https://via.placeholder.com/120?text=Wave" alt="Wave image">
                Wave
            </label>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div id="resultBox"></div>

    <script>
        const quizForm = document.getElementById('quizForm');
        const resultBox = document.getElementById('resultBox');

        quizForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const selected1 = Array.from(document.querySelectorAll('input[name="choice1"]:checked')).map(input => input.value);
            const selected2 = Array.from(document.querySelectorAll('input[name="choice2"]:checked')).map(input => input.value);
            const selected = selected1.concat(selected2);

            if (selected.length === 0) {
                resultBox.textContent = 'Please choose at least one image.';
                return;
            }

            let message = 'You selected: ' + selected.join(', ') + '. ';

            if (selected.includes('sunny') && selected.includes('wave')) {
                message += 'You are warm and calm.';
            } else if (selected.includes('star') && selected.includes('sunny')) {
                message += 'You are bright and confident.';
            } else if (selected.includes('wave') && selected.includes('star')) {
                message += 'You are creative and flowing.';
            } else if (selected.includes('sunny')) {
                message += 'You are cheerful.';
            } else if (selected.includes('star')) {
                message += 'You are shining.';
            } else if (selected.includes('wave')) {
                message += 'You are relaxed.';
            }

            resultBox.textContent = message;
        });
    </script>
</body>
</html>
