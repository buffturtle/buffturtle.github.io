<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tung Tung Motivation</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
    header{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:rgba(0,0,0,0.35);z-index:10;text-align:center;font-size:20px}
    .strip{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;height:100vh;scroll-snap-type:x mandatory}
    .panel{flex:0 0 100%;height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
    .panel img{width:100%;height:100vh;object-fit:cover;display:block}
    .strip::-webkit-scrollbar{display:none}
  </style>
</head>
<body>
  <header>Tung Tung Motivation</header>

  <div class="strip" role="region" aria-label="Motivation images">
    <div class="panel"><img src="mybuffsahur.jpg" alt="My Buff Sahur"></div>
    <div class="panel"><img src="mylove.jpg" alt="My Love"></div>
  </div>
  <audio id="bg-audio" src="tikitiki.mp3" loop autoplay></audio>

  <script>
    (function(){
      var a=document.getElementById('bg-audio');
      a.volume = 1.0;
      a.loop = true;
      a.play().catch(function(e){});
    })();
  </script>
</body>
</html>
